[package]
name = "disk-tidy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Preview disk usage and remove what is safe to remove"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[dev-dependencies]
tempfile = "3"
